<!DOCTYPE html>
<html lang="am" x-data="{ lang: 'am', showModal: false, orderSuccess: false, selectedProduct: null }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEEKED - Apparel Import</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.15);
        }
        .glow-effect:hover {
            box-shadow: 0 0 30px 0px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen selection:bg-purple-500 selection:text-white">

    <!-- Header / Nav -->
    <header class="sticky top-0 z-50 bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">GEEKED</h1>
            
            <div class="flex items-center gap-3">
                <!-- Language Switcher -->
                <button @click="lang = lang === 'am' ? 'en' : 'am'" class="bg-slate-900/90 border border-slate-800 px-3.5 py-2 rounded-xl text-xs font-semibold hover:border-purple-500/50 transition">
                    <i class="fa-solid fa-globe mr-1.5 text-purple-400"></i> <span x-text="lang === 'am' ? 'English' : 'አማርኛ'"></span>
                </button>

                <!-- TikTok Link -->
                <a href="https://www.tiktok.com/@geeked_tee?_r=1&_t=ZS-98bqvgiGwSW" target="_blank" class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl hover:text-purple-400 hover:border-purple-500/50 transition" title="TikTok">
                    <i class="fa-brands fa-tiktok text-base"></i>
                </a>

                <!-- Telegram Support Link -->
                <a href="https://t.me/geeked_tee" target="_blank" class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl hover:text-purple-400 hover:border-purple-500/50 transition" title="Telegram">
                    <i class="fa-brands fa-telegram text-base"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-16 px-6 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-purple-900/10 via-transparent to-transparent pointer-events-none"></div>
        <div class="max-w-3xl mx-auto relative z-10">
            <span class="inline-block bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-semibold px-3 py-1 rounded-full mb-4">Premium Apparels & Custom Prints</span>
            <h2 class="text-3xl md:text-5xl font-extrabold mb-4 tracking-tight" x-text="lang === 'am' ? 'ለየት ያሉ ጥራት ያላቸው ቲሸርቶች' : 'Unique Quality T-Shirts'"></h2>
            <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto mb-8" x-text="lang === 'am' ? 'የምንፈልጉትን ዲዛይን እና መደበኛ ቲሸርቶች አሁኑኑ ይዘዙ!' : 'Order your custom design and normal T-shirts now!'"></p>
            
            <!-- Custom Design Notice -->
            <a href="https://t.me/geeked_tee" target="_blank" class="inline-flex items-center bg-gradient-to-r from-purple-900/40 to-indigo-900/40 border border-purple-500/30 px-5 py-2.5 rounded-2xl text-xs md:text-sm text-purple-200 hover:border-purple-500/60 transition shadow-lg">
                <i class="fa-brands fa-telegram mr-2 text-purple-400 text-base"></i>
                <span x-text="lang === 'am' ? 'የሚፈልጉት የተለየ ዲዛይን ካለ በቴሌግራም (@geeked_tee) ላኩልን!' : 'If you have a custom design, send it via Telegram!'"></span>
            </a>
        </div>
    </section>

    <!-- Products Section -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <h3 class="text-lg font-bold mb-6 flex items-center gap-2 text-slate-200">
            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
            <span x-text="lang === 'am' ? 'ምርቶቻችን (Products)' : 'Our Products'"></span>
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Product 1 -->
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-3xl overflow-hidden p-5 flex flex-col justify-between glow-effect transition duration-300">
                <div>
                    <div class="relative overflow-hidden rounded-2xl mb-4 group">
                        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="Normal T-Shirt" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent"></div>
                    </div>
                    <h4 class="text-lg font-bold text-slate-100" x-text="lang === 'am' ? 'ኖርማል ነጭ እና ጥቁር ቲሸርት' : 'Normal White & Black T-Shirt'"></h4>
                    <p class="text-purple-400 font-extrabold text-lg mt-1">700 ብር (ETB)</p>
                </div>
                <button onclick="openModal('Normal White & Black T-Shirt (ኖርማል ቲሸርት)', 700)" class="mt-6 w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-purple-600/20 transition active:scale-[0.98]" x-text="lang === 'am' ? 'ይግዙ / አሁን ያዙ' : 'Buy Now'"></button>
            </div>

            <!-- Product 2 -->
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-3xl overflow-hidden p-5 flex flex-col justify-between glow-effect transition duration-300">
                <div>
                    <div class="relative overflow-hidden rounded-2xl mb-4 group">
                        <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500" alt="Design T-Shirt" class="w-full h-72 object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent"></div>
                    </div>
                    <h4 class="text-lg font-bold text-slate-100" x-text="lang === 'am' ? 'ዲዛይን ያለው ነጭ እና ጥቁር ቲሸርት' : 'Designed White & Black T-Shirt'"></h4>
                    <p class="text-purple-400 font-extrabold text-lg mt-1">1300 ብር (ETB)</p>
                </div>
                <button onclick="openModal('Designed White & Black T-Shirt (ዲዛይን ያለው ቲሸርት)', 1300)" class="mt-6 w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-purple-600/20 transition active:scale-[0.98]" x-text="lang === 'am' ? 'ይግዙ / አሁን ያዙ' : 'Buy Now'"></button>
            </div>
        </div>

        <!-- Sample / New Arrivals Gallery -->
        <div class="mt-20">
            <h3 class="text-lg font-bold mb-6 flex items-center gap-2 text-slate-200">
                <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                <span x-text="lang === 'am' ? 'አዳዲስ ገቢዎች እና ሳምፕሎች (New Arrivals & Samples)' : 'New Arrivals & Samples'"></span>
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="overflow-hidden rounded-2xl border border-slate-800/80 group">
                    <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=300" class="h-44 w-full object-cover group-hover:scale-105 transition duration-500" alt="Sample 1">
                </div>
                <div class="overflow-hidden rounded-2xl border border-slate-800/80 group">
                    <img src="https://images.unsplash.com/photo-1562157873-818bc0726f68?w=300" class="h-44 w-full object-cover group-hover:scale-105 transition duration-500" alt="Sample 2">
                </div>
                <div class="overflow-hidden rounded-2xl border border-slate-800/80 group">
                    <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300" class="h-44 w-full object-cover group-hover:scale-105 transition duration-500" alt="Sample 3">
                </div>
                <div class="overflow-hidden rounded-2xl border border-slate-800/80 group">
                    <img src="https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=300" class="h-44 w-full object-cover group-hover:scale-105 transition duration-500" alt="Sample 4">
                </div>
            </div>
        </div>
    </main>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-[#0f172a] border border-slate-800 max-w-md w-full p-6 md:p-8 rounded-3xl relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
            
            <!-- Form View -->
            <div id="formContainer">
                <form onsubmit="submitOrder(event)">
                    <h3 class="text-xl font-bold mb-1 text-slate-100" x-text="lang === 'am' ? 'የማዘዣ እና ክፍያ ፎርም' : 'Checkout Form'"></h3>
                    <p id="productInfoText" class="text-xs font-semibold text-purple-400 mb-6"></p>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5" x-text="lang === 'am' ? 'ሙሉ ስም (Full Name)' : 'Full Name'"></label>
                            <input type="text" id="fullname" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5" x-text="lang === 'am' ? 'ስልክ ቁጥር (Phone Number)' : 'Phone Number'"></label>
                            <input type="tel" id="phone" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                        </div>

                        <!-- T-Shirt Size Selection -->
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5" x-text="lang === 'am' ? 'የቲሸርት ልክ (T-Shirt Size)' : 'T-Shirt Size'"></label>
                            <select id="tshirtSize" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                                <option value="" disabled selected>-- ልክ ይምረጡ / Select Size --</option>
                                <option value="S">Small (S)</option>
                                <option value="M">Medium (M)</option>
                                <option value="L">Large (L)</option>
                                <option value="XL">Extra Large (XL)</option>
                                <option value="XXL">Double Extra Large (XXL)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5" x-text="lang === 'am' ? 'አድራሻ (Address)' : 'Address'"></label>
                            <input type="text" id="address" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                        </div>

                        <!-- Payment Information Section -->
                        <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80 space-y-3">
                            <h4 class="font-bold text-purple-400 text-xs uppercase tracking-wider" x-text="lang === 'am' ? 'የክፍያ አካውንቶች (Payment Accounts)' : 'Payment Accounts'"></h4>
                            
                            <div class="text-xs text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                                <p class="font-semibold text-purple-300 mb-0.5">ንግድ ባንክ (CBE):</p>
                                <p>ቁጥር: <strong class="text-white">1000744476918</strong></p>
                                <p>ስም: <strong class="text-white">Imran</strong></p>
                            </div>

                            <div class="text-xs text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                                <p class="font-semibold text-purple-300 mb-0.5">ቴሌብር (Telebirr):</p>
                                <p>ቁጥር: <strong class="text-white">0929095285</strong></p>
                                <p>ስም: <strong class="text-white">Salih</strong></p>
                            </div>
                            
                            <div>
                                <label class="block text-xs text-slate-400 mb-1.5" x-text="lang === 'am' ? 'የክፍያ ትራንዛክሽን ቁጥር (Transaction ID)' : 'Transaction ID'"></label>
                                <input type="text" id="txId" required placeholder="trx..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500 transition">
                            </div>

                            <div>
                                <label class="block text-xs text-slate-400 mb-1.5" x-text="lang === 'am' ? 'የክፍያ ሪሲት ስክሪንሾት (Upload Receipt)' : 'Upload Receipt Screenshot'"></label>
                                <input type="file" id="receiptFile" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer transition">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="mt-6 w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-3.5 rounded-2xl font-bold text-sm shadow-lg shadow-purple-600/20 transition active:scale-[0.98]" x-text="lang === 'am' ? 'ክፍያ ፈጽሜ ኦርደር አድርግ' : 'Submit Order & Pay'"></button>
                </form>
            </div>

            <!-- Receipt Success View -->
            <div id="successContainer" style="display: none;" class="text-center py-6">
                <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 class="text-xl font-bold mb-1 text-slate-100" x-text="lang === 'am' ? 'ትዕዛዝዎ ተሳክቷል!' : 'Order Successful!'"></h3>
                <p class="text-xs text-slate-400 mb-6" x-text="lang === 'am' ? 'የክፍያ ሪሲትዎ እና መረጃዎ ወደ ቴሌግራም ተልኳል።' : 'Your receipt and order details have been sent.'"></p>

                <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl text-left text-xs mb-6 space-y-2">
                    <p class="flex justify-between"><strong class="text-slate-400">Name:</strong> <span id="resName" class="text-white font-medium"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-400">Phone:</strong> <span id="resPhone" class="text-white font-medium"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-400">Size:</strong> <span id="resSize" class="text-white font-medium"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-400">Address:</strong> <span id="resAddress" class="text-white font-medium"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-400">Item:</strong> <span id="resItem" class="text-white font-medium"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-400">Price:</strong> <span id="resPrice" class="text-purple-400 font-bold"></span> <span class="text-slate-400">ETB</span></p>
                    <p class="flex justify-between"><strong class="text-slate-400">TX ID:</strong> <span id="resTxId" class="text-white font-medium"></span></p>
                </div>

                <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 py-3 rounded-2xl font-semibold text-sm transition" x-text="lang === 'am' ? 'ዘግቶ መውጣት' : 'Close'"></button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentProduct = '';
        let currentPrice = 0;

        function openModal(name, price) {
            currentProduct = name;
            currentPrice = price;
            document.getElementById('productInfoText').innerText = `${name} - ${price} ETB`;
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('successContainer').style.display = 'none';
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
            document.getElementById('fullname').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('tshirtSize').selectedIndex = 0;
            document.getElementById('address').value = '';
            document.getElementById('txId').value = '';
            document.getElementById('receiptFile').value = '';
        }

        async function submitOrder(event) {
            event.preventDefault();
            
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const size = document.getElementById('tshirtSize').value;
            const address = document.getElementById('address').value;
            const txId = document.getElementById('txId').value;
            const fileInput = document.getElementById('receiptFile');
            const submitBtn = document.getElementById('submitBtn');

            if (fileInput.files.length === 0) {
                alert('እባክዎ የክፍያ ማረጋገጫ ፎቶ (Receipt) ይስቀሉ!');
                return;
            }

            submitBtn.innerText = 'በመላክ ላይ...';
            submitBtn.disabled = true;

            const botToken = "8682453151:AAEaXZeTXsmVmSJUM-K2jxC_sCNmBbVeyb8";
            const chatId = "7415186084";

            // 1. Send Text Details to Telegram
            const message = `🛍 አዲስ የቲሸርት ትዕዛዝ መጥቷል!\n\n👕 እቃው: ${currentProduct}\n💰 ዋጋ: ${currentPrice} ETB\n📏 ልክ (Size): ${size}\n👤 ስም: ${name}\n📞 ስልክ: ${phone}\n📍 አድራሻ: ${address}\n💳 ትራንዛክሽን / TX ID: ${txId}`;
            const textUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            try {
                await fetch(textUrl);

                // 2. Send Receipt Photo to Telegram
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', fileInput.files[0]);
                formData.append('caption', `📸 የክፍያ ሪሲት - ከደንበኛ: ${name} (${phone})`);

                const photoUrl = `https://api.telegram.org/bot${botToken}/sendPhoto`;
                await fetch(photoUrl, {
                    method: 'POST',
                    body: formData
                });

                // Show success details inside modal view
                document.getElementById('resName').innerText = name;
                document.getElementById('resPhone').innerText = phone;
                document.getElementById('resSize').innerText = size;
                document.getElementById('resAddress').innerText = address;
                document.getElementById('resItem').innerText = currentProduct;
                document.getElementById('resPrice').innerText = currentPrice;
                document.getElementById('resTxId').innerText = txId;

                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successContainer').style.display = 'block';

            } catch (error) {
                alert('ትዕዛዙን መላክ አልተቻለም። እባክዎ ኢንተርኔትዎን ይፈትሹ።');
            } finally {
                submitBtn.innerText = 'ክፍያ ፈጽሜ ኦርደር አድርግ';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
