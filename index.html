<!DOCTYPE html>
<html lang="am" x-data="{ lang: 'am', showModal: false, orderSuccess: false, selectedProduct: null }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEEKED - Apparel Import</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <!-- Header / Nav -->
    <header class="sticky top-0 z-50 bg-slate-900/85 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider text-purple-500">GEEKED</h1>
            
            <div class="flex items-center gap-3">
                <!-- Language Switcher -->
                <button @click="lang = lang === 'am' ? 'en' : 'am'" class="bg-slate-800 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">
                    <i class="fa-solid fa-globe mr-1"></i> <span x-text="lang === 'am' ? 'English' : 'አማርኛ'"></span>
                </button>

                <!-- TikTok Link -->
                <a href="https://www.tiktok.com/@geeked_tee?_r=1&_t=ZS-98bqvgiGwSW" target="_blank" class="bg-slate-800 p-2 rounded-lg hover:text-purple-400 transition" title="TikTok">
                    <i class="fa-brands fa-tiktok text-lg"></i>
                </a>

                <!-- Telegram Support Link -->
                <a href="https://t.me/geeked_tee" target="_blank" class="bg-slate-800 p-2 rounded-lg hover:text-purple-400 transition" title="Telegram">
                    <i class="fa-brands fa-telegram text-lg"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-12 px-4 text-center bg-gradient-to-b from-purple-950/40 to-slate-950">
        <h2 class="text-3xl md:text-5xl font-extrabold mb-4" x-text="lang === 'am' ? 'ለየት ያሉ ጥራት ያላቸው ቲሸርቶች' : 'Unique Quality T-Shirts'"></h2>
        <p class="text-slate-400 max-w-xl mx-auto mb-6" x-text="lang === 'am' ? 'የምንፈልጉትን ዲዛይን እና መደበኛ ቲሸርቶች አሁኑኑ ይዘዙ!' : 'Order your custom design and normal T-shirts now!'"></p>
        
        <!-- Custom Design Notice -->
        <a href="https://t.me/geeked_tee" target="_blank" class="inline-flex items-center bg-purple-900/30 border border-purple-500/30 px-4 py-2 rounded-xl text-sm text-purple-300 hover:bg-purple-900/50 transition">
            <i class="fa-brands fa-telegram mr-2 text-purple-400 text-base"></i>
            <span x-text="lang === 'am' ? 'የሚፈልጉት የተለየ ዲዛይን ካለ በቴሌግራም (@geeked_tee) ላኩልን!' : 'If you have a custom design, send it via Telegram!'"></span>
        </a>
    </section>

    <!-- Products Section -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h3 class="text-xl font-bold mb-6 border-l-4 border-purple-500 pl-3" x-text="lang === 'am' ? 'ምርቶቻችን (Products)' : 'Our Products'"></h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Product 1 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-4 flex flex-col justify-between">
                <div>
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="Normal T-Shirt" class="w-full h-64 object-cover rounded-xl mb-4">
                    <h4 class="text-lg font-bold" x-text="lang === 'am' ? 'ኖርማል ነጭ እና ጥቁር ቲሸርት' : 'Normal White & Black T-Shirt'"></h4>
                    <p class="text-purple-400 font-bold mt-2">700 ብር (ETB)</p>
                </div>
                <button onclick="openModal('Normal White & Black T-Shirt (ኖርማል ቲሸርት)', 700)" class="mt-4 w-full bg-purple-600 hover:bg-purple-700 py-2.5 rounded-xl font-semibold transition" x-text="lang === 'am' ? 'ይግዙ / አሁን ያዙ' : 'Buy Now'"></button>
            </div>

            <!-- Product 2 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-4 flex flex-col justify-between">
                <div>
                    <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=500" alt="Design T-Shirt" class="w-full h-64 object-cover rounded-xl mb-4">
                    <h4 class="text-lg font-bold" x-text="lang === 'am' ? 'ዲዛይን ያለው ነጭ እና ጥቁር ቲሸርት' : 'Designed White & Black T-Shirt'"></h4>
                    <p class="text-purple-400 font-bold mt-2">1300 ብር (ETB)</p>
                </div>
                <button onclick="openModal('Designed White & Black T-Shirt (ዲዛይን ያለው ቲሸርት)', 1300)" class="mt-4 w-full bg-purple-600 hover:bg-purple-700 py-2.5 rounded-xl font-semibold transition" x-text="lang === 'am' ? 'ይግዙ / አሁን ያዙ' : 'Buy Now'"></button>
            </div>
        </div>

        <!-- Sample / New Arrivals Gallery -->
        <div class="mt-16">
            <h3 class="text-xl font-bold mb-6 border-l-4 border-purple-500 pl-3" x-text="lang === 'am' ? 'አዳዲስ ገቢዎች እና ሳምፕሎች (New Arrivals & Samples)' : 'New Arrivals & Samples'"></h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=300" class="rounded-xl h-40 w-full object-cover border border-slate-800" alt="Sample 1">
                <img src="https://images.unsplash.com/photo-1562157873-818bc0726f68?w=300" class="rounded-xl h-40 w-full object-cover border border-slate-800" alt="Sample 2">
                <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300" class="rounded-xl h-40 w-full object-cover border border-slate-800" alt="Sample 3">
                <img src="https://images.unsplash.com/photo-1529374255404-311a2a4f1fd9?w=300" class="rounded-xl h-40 w-full object-cover border border-slate-800" alt="Sample 4">
            </div>
        </div>
    </main>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-slate-900 border border-slate-800 max-w-md w-full p-6 rounded-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <!-- Form View -->
            <div id="formContainer">
                <form onsubmit="submitOrder(event)">
                    <h3 class="text-xl font-bold mb-2" x-text="lang === 'am' ? 'የማዘዣ እና ክፍያ ፎርም' : 'Checkout Form'"></h3>
                    <p id="productInfoText" class="text-sm text-purple-400 mb-4"></p>
                    
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1" x-text="lang === 'am' ? 'ሙሉ ስም (Full Name)' : 'Full Name'"></label>
                        <input type="text" id="fullname" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                    </div>

                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1" x-text="lang === 'am' ? 'ስልክ ቁጥር (Phone Number)' : 'Phone Number'"></label>
                        <input type="tel" id="phone" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                    </div>

                    <!-- T-Shirt Size Selection -->
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1" x-text="lang === 'am' ? 'የቲሸርት ልክ (T-Shirt Size)' : 'T-Shirt Size'"></label>
                        <select id="tshirtSize" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                            <option value="" disabled selected>-- ልክ ይምረጡ / Select Size --</option>
                            <option value="S">Small (S)</option>
                            <option value="M">Medium (M)</option>
                            <option value="L">Large (L)</option>
                            <option value="XL">Extra Large (XL)</option>
                            <option value="XXL">Double Extra Large (XXL)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1" x-text="lang === 'am' ? 'አድራሻ (Address)' : 'Address'"></label>
                        <input type="text" id="address" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                    </div>

                    <!-- Payment Information Section -->
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-3 space-y-2">
                        <h4 class="font-bold text-purple-400 text-sm" x-text="lang === 'am' ? 'የክፍያ አካውንቶች (Payment Accounts)' : 'Payment Accounts'"></h4>
                        
                        <div class="text-xs text-slate-300 bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                            <p class="font-semibold text-purple-300">ንግድ ባንክ (CBE):</p>
                            <p>ቁጥር: <strong class="text-white">1000744476918</strong></p>
                            <p>ስም: <strong class="text-white">Imran</strong></p>
                        </div>

                        <div class="text-xs text-slate-300 bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                            <p class="font-semibold text-purple-300">ቴሌብር (Telebirr):</p>
                            <p>ቁጥር: <strong class="text-white">0929095285</strong></p>
                            <p>ስም: <strong class="text-white">Salih</strong></p>
                        </div>
                        
                        <div class="pt-1">
                            <label class="block text-xs text-slate-400 mb-1" x-text="lang === 'am' ? 'የክፍያ ትራንዛክሽን ቁጥር (Transaction ID)' : 'Transaction ID'"></label>
                            <input type="text" id="txId" required placeholder="trx..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                        </div>

                        <div class="pt-1">
                            <label class="block text-xs text-slate-400 mb-1" x-text="lang === 'am' ? 'የክፍያ ሪሲት ስክሪንሾት (Upload Receipt)' : 'Upload Receipt Screenshot'"></label>
                            <input type="file" id="receiptFile" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-xl font-bold transition" x-text="lang === 'am' ? 'ክፍያ ፈጽሜ ኦርደር አድርግ' : 'Submit Order & Pay'"></button>
                </form>
            </div>

            <!-- Receipt Success View -->
            <div id="successContainer" style="display: none;" class="text-center py-4">
                <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 class="text-xl font-bold mb-2" x-text="lang === 'am' ? 'ትዕዛዝዎ ተሳክቷል!' : 'Order Successful!'"></h3>
                <p class="text-sm text-slate-400 mb-6" x-text="lang === 'am' ? 'የክፍያ ሪሲትዎ እና መረጃዎ ወደ ቴሌግራም ተልኳል።' : 'Your receipt and order details have been sent.'"></p>

                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left text-sm mb-6 space-y-2">
                    <p><strong>Name:</strong> <span id="resName"></span></p>
                    <p><strong>Phone:</strong> <span id="resPhone"></span></p>
                    <p><strong>Size:</strong> <span id="resSize"></span></p>
                    <p><strong>Address:</strong> <span id="resAddress"></span></p>
                    <p><strong>Item:</strong> <span id="resItem"></span></p>
                    <p><strong>Price:</strong> <span id="resPrice"></span> ETB</p>
                    <p><strong>TX ID:</strong> <span id="resTxId"></span></p>
                </div>

                <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl font-semibold" x-text="lang === 'am' ? 'ዘግቶ መውጣት' : 'Close'"></button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentProduct = '';
        let currentPrice = 0;

        function openModal(name, price) {
            currentProduct = name;
            currentPrice = price;
            document.getElementById('productInfoText').innerText = `${name} - ${price} ETB`;
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('successContainer').style.display = 'none';
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
            document.getElementById('fullname').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('tshirtSize').selectedIndex = 0;
            document.getElementById('address').value = '';
            document.getElementById('txId').value = '';
            document.getElementById('receiptFile').value = '';
        }

        async function submitOrder(event) {
            event.preventDefault();
            
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const size = document.getElementById('tshirtSize').value;
            const address = document.getElementById('address').value;
            const txId = document.getElementById('txId').value;
            const fileInput = document.getElementById('receiptFile');
            const submitBtn = document.getElementById('submitBtn');

            if (fileInput.files.length === 0) {
                alert('እባክዎ የክፍያ ማረጋገጫ ፎቶ (Receipt) ይስቀሉ!');
                return;
            }

            submitBtn.innerText = 'በመላክ ላይ...';
            submitBtn.disabled = true;

            // Show success details inside modal
            document.getElementById('resName').innerText = name;
            document.getElementById('resPhone').innerText = phone;
            document.getElementById('resSize').innerText = size;
            document.getElementById('resAddress').innerText = address;
            document.getElementById('resItem').innerText = currentProduct;
            document.getElementById('resPrice').innerText = currentPrice;
            document.getElementById('resTxId').innerText = txId;

            // Telegram API Integration (Sends Photo + Caption)
            const botToken = '8682453151:AAEaXZETXsmVmSJUM-K2jxC_sCNmBbVeyb8';
            const chatId = '7415186084';
            
            const caption = `🚨 አዲስ ትዕዛዝ (New Order)!\n\n` +
                              `👕 ምርት: ${currentProduct}\n` +
                              `📏 ልክ (Size): ${size}\n` +
                              `💰 ዋጋ: ${currentPrice} ብር\n` +
                              `👤 ስም: ${name}\n` +
                              `📞 ስልክ: ${phone}\n` +
                              `📍 አድራሻ: ${address}\n` +
                              `🔢 ፕኢይመንት TX: ${txId}`;

            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', fileInput.files[0]);
            formData.append('caption', caption);

            try {
                let response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                let result = await response.json();
                
                if (result.ok) {
                    document.getElementById('formContainer').style.display = 'none';
                    document.getElementById('successContainer').style.display = 'block';
                } else {
                    alert('ትዕዛዙን መላክ አልተቻለም። እባክዎ እንደገና ይሞክሩ።');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('የኔትወርክ ስህተት አጋጥሟል!');
            } finally {
                submitBtn.innerText = 'ክፍያ ፈጽሜ ኦርደር አድርግ';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
